id = "herdr-gh-checks"
name = "GH Checks"
version = "0.2.3"
min_herdr_version = "0.7.0"
description = "Watch the current PR's CI (5s) in a pane; CI/merge status on sidebar space rows. Go + Charm."
platforms = ["linux", "macos", "windows"]

# `plugin install` runs the host-matching fetch-or-build step: it downloads a
# prebuilt binary only when its digest matches the reviewed allowlist in
# release-checksums.txt, and otherwise compiles from source (needs Go).
# `plugin link` skips it — for local dev, build it yourself: go build -o herdr-gh-checks .
[[build]]
platforms = ["linux", "macos"]
command = ["/bin/sh", "scripts/fetch-or-build.sh"]

[[build]]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-File", "scripts/fetch-or-build.ps1"]

[[startup]]
command = ["./herdr-gh-checks", "--sidebar"]

[[panes]]
id = "panel"
title = "GH Checks"
placement = "split"
command = ["./herdr-gh-checks"]

[[actions]]
id = "show"
title = "Watch PR CI"
contexts = ["workspace"]
command = ["./herdr-gh-checks"]

[[panes]]
id = "merge"
title = "Merge PR"
placement = "popup"
width = 80
height = 22
command = ["./herdr-gh-checks", "--merge"]

[[actions]]
id = "merge"
title = "Merge PR"
contexts = ["workspace"]
command = ["./herdr-gh-checks"]
